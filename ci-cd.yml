name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1. CI : les tests tournent à chaque push et à chaque pull request
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -q

  # 2. CD : si les tests passent, déploiement sur le VPS (uniquement pour un push sur main)
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-vps          # jamais deux déploiements en même temps
    steps:
      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Mettre à jour le code et relancer l'application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "cd ~/app && git fetch origin main && git reset --hard origin/main \
             && docker compose up -d --build && docker image prune -f"

      - name: Vérifier que l'application répond
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "http://$VPS_HOST/api/stats"; then echo; exit 0; fi
            echo "En attente de l'application ($i/24)..."; sleep 5
          done
          echo "L'application ne répond pas après le déploiement"; exit 1
